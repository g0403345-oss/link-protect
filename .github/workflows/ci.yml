name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          # Dummy values so build doesn't fail on missing env vars
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          DISCORD_CLIENT_ID: "000000000000000000"
          DISCORD_CLIENT_SECRET: ci-placeholder
          BOT_TOKEN: ci-placeholder
          BOT_API_URL: http://localhost:3001
          BOT_API_SECRET: ci-placeholder
        run: npm run build

  lint-bot:
    name: Lint Bot (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile api_server.py
          for f in cogs/*.py; do python -m py_compile "$f"; done
          echo "All Python files OK"
